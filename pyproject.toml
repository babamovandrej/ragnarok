[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragnarok"
version = "0.1.0"
description = "RAG assistant for understanding codebases, with cited multi-hop retrieval and a live naive-vs-RAGnarok comparison."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["ragnarok"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
