[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragnarok"
version = "0.1.0"
description = "RAG assistant for understanding codebases, with cited multi-hop retrieval and a live naive-vs-RAGnarok comparison."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "bm25s==0.2.14",
    "chromadb==0.5.20",
    "gradio==5.50.0",
    "huggingface_hub==0.36.2",
    "langgraph==0.2.76",
    "llama_cpp_python==0.3.16",
    "numpy==2.4.6",
    "overrides==7.7.0",
    "pydantic==2.12.3",
    "sentence-transformers==3.4.1",
    "torch==2.13.0",
    "transformers==4.57.6",
    "tree-sitter==0.23.2",
    "tree-sitter-language-pack==0.2.0",
]

[project.optional-dependencies]
dev = [
    "coverage==7.15.2",
    "mypy==2.3.0",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the network / downloads real models or repos; excluded by default, run with -m integration",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "app.py"]
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = ["bm25s"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src", "scripts", "app"]
