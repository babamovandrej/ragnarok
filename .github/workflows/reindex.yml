name: Reindex

# The daily schedule trigger is disabled: this workflow requires an HF_DATASET_REPO
# GitHub Actions variable + HF_TOKEN secret to be configured, which this project
# deliberately hasn't set up (the deployed Space builds its index live via the Ingest
# tab instead — see README.md). Left as workflow_dispatch-only so it can still be run
# manually later if the Dataset-repo persistence path ever gets configured.
on:
  workflow_dispatch:

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the demo repo with enough history to diff against
        run: |
          git clone https://github.com/encode/starlette .ragnarok_cache/clones/encode/starlette

      - uses: actions/checkout@v4
        with:
          path: ragnarok

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ragnarok
        run: |
          pip install -e .
          pip install -r requirements.txt

      - name: Pull the last-pushed index (rehydrates Chroma from our parquet schema)
        working-directory: ragnarok
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from pathlib import Path
          from src.utils.hf_dataset_io import refresh_if_stale
          refresh_if_stale('${{ vars.HF_DATASET_REPO }}', Path('.ragnarok_cache/encode/starlette'), 'encode/starlette')
          "

      - name: Incremental reindex (re-chunk/re-embed only changed files)
        working-directory: ragnarok
        run: |
          python scripts/build_index.py \
            --repo-path ../.ragnarok_cache/clones/encode/starlette \
            --cache-dir .ragnarok_cache/encode/starlette \
            --incremental --json

      - name: Push the updated index to the HF Dataset repo
        working-directory: ragnarok
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/push_index_to_hub.py \
            .ragnarok_cache/encode/starlette "${{ vars.HF_DATASET_REPO }}"
