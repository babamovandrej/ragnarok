name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q --cov --cov-report=term-missing

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships with ~14GB free by default, most already consumed by
      # preinstalled toolchains this job never uses. EMBEDDING_MODEL_ID (task 20) is an
      # ~8GB download — without this, the runner reliably runs out of disk space
      # mid-download ("No space left on device") rather than failing on anything this
      # job is actually testing.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt

      - name: End-to-end ingestion smoke test (real clone + real embedding model)
        run: pytest -m integration tests/integration/test_ingestion_e2e.py -q
