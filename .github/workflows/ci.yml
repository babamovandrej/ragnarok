name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install "$(grep -E '^torch==' requirements.txt)" --no-deps --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q --cov --cov-report=term-missing

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install "$(grep -E '^torch==' requirements.txt)" --no-deps --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: End-to-end ingestion smoke test (real clone, fake embedder)
        run: pytest -m integration tests/integration/test_ingestion_e2e.py -q
